name: Flutter quality

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  root-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true
      - name: Install root dependencies
        run: flutter pub get
      - name: Install web app dependencies
        working-directory: web_app
        run: flutter pub get
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver web_app/lib
      - name: Scan technical-debt markers
        shell: pwsh
        run: ./tool/scan_tech_debt.ps1
      - name: Install DCM
        uses: CQLabs/setup-dcm@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: 1.34.0
      - name: Check cyclomatic complexity
        run: dcm analyze --ci-key=oss --email=oss lib web_app/lib

